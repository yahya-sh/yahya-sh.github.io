<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        {{ config.extra.name }} — {{ config.extra.role }}
      {% endblock %}
    </title>
    <meta name="description" content="{{ config.description }}" />

    <link rel="icon" type="image/svg+xml" href="{{ get_url(path='img/logo.svg') }}" />

    <!-- Inlined Compiled Tailwind CSS (Zero render-blocking requests) -->
    <style>{{ load_data(path="static/css/compiled.style.css") | safe }}</style>

    <style>
      :root {
        --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
        --font-display: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      }

      body {
        font-family: var(--font-sans);
      }

      .font-display {
        font-family: var(--font-display);
      }

      /* Accessibility: Skip Navigation Link */
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #38bdf8;
        color: #0f172a;
        padding: 8px 16px;
        font-weight: 700;
        z-index: 100;
        transition: top 0.2s ease;
        text-decoration: none;
        border-radius: 0 0 4px 0;
      }
      .skip-link:focus {
        top: 0;
      }

      /* Fix Non-Composited Animations (Uses GPU scale transform instead of width/height) */
      .dot {
        will-change: transform;
        transition: transform 200ms ease, background-color 200ms ease;
      }
      .group:hover .dot {
        transform: scale(1.5);
      }

      /* Respect reduced-motion preferences */
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto !important;
        }
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Focus rings for keyboard navigation accessibility */
      a:focus-visible,
      button:focus-visible {
        outline: 1px solid #ffffff;
        outline-offset: 4px;
      }
      ::selection {
        background: #ffffff;
        color: #000000;
      }
      
      html,
      body {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      html::-webkit-scrollbar,
      body::-webkit-scrollbar,
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
    </style>

    {% block extra_head %}{% endblock %}
  </head>
  <body class="bg-black text-white font-sans antialiased overflow-hidden">
    <!-- Skip to main content link for keyboard & screen reader users -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Header Landmark (HTML5 + ARIA role) -->
    <header role="banner" class="fixed top-0 left-0 w-full z-40 flex items-center justify-between px-6 md:px-10 py-5 md:py-6 pointer-events-none">
      <a href="/" class="pointer-events-auto flex items-center gap-3 group" aria-label="{{ config.extra.name }} — home">
        <img src="{{ get_url(path='img/logo.svg') }}" alt="" width="24" height="24" class="h-6 w-6 opacity-90 group-hover:opacity-100 transition-opacity" aria-hidden="true" />
        <span class="font-display text-sm md:text-base tracking-tight text-white/90">{{ config.extra.name }}</span>
      </a>

      <!-- Navigation Landmark -->
      <nav role="navigation" aria-label="Main Navigation" class="pointer-events-auto hidden sm:flex items-center gap-8 text-sm text-white/70">
        {% if config.extra.show_projects_nav %}
          <a href="{{ get_url(path='projects') }}" class="hover:text-white transition-colors">Projects</a>
        {% endif %}
        {% if config.extra.show_blog_nav %}
          <a href="{{ get_url(path='blog') }}" class="hover:text-white transition-colors">Blog</a>
        {% endif %}
      </nav>
    </header>

    {% block content %}{% endblock %}

    {% block extra_body %}{% endblock %}

    <script src="{{ get_url(path='js/main.js') }}" defer></script>
  </body>
</html>
