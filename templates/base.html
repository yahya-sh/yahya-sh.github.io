<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ config.extra.name }} — {{ config.extra.role }}{% endblock title %}</title>
  <meta name="description" content="{{ config.description }}">

  <link rel="icon" type="image/svg+xml" href="{{ get_url(path='img/favicon.svg') }}">

  <!-- Fonts: Space Grotesk for display/headings, Inter for body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind (Play CDN — zero build step, keeps this project easy to edit).
       To move to a compiled build later: `npm install -D tailwindcss` and
       swap this script tag for a linked stylesheet built via the Tailwind CLI. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            sans: ['"Inter"', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    /* Respect reduced-motion preferences */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto !important; }
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
    /* Keep a visible focus ring everywhere (accessibility) */
    a:focus-visible, button:focus-visible {
      outline: 1px solid #ffffff;
      outline-offset: 4px;
    }
    ::selection { background: #ffffff; color: #000000; }
  </style>

  {% block extra_head %}{% endblock extra_head %}
</head>
<body class="bg-black text-white font-sans antialiased overflow-hidden">

  <!-- Nav: minimal on purpose. Structured so Projects / Blog links can be
       added later without touching the layout — see the commented block below. -->
  <header class="fixed top-0 left-0 w-full z-40 flex items-center justify-between px-6 md:px-10 py-5 md:py-6 pointer-events-none">
    <a href="/" class="pointer-events-auto flex items-center gap-3 group" aria-label="{{ config.extra.name }} — home">
      <img src="{{ get_url(path='img/logo-white.svg') }}" alt="" class="h-6 w-6 opacity-90 group-hover:opacity-100 transition-opacity" aria-hidden="true">
      <span class="font-display text-sm md:text-base tracking-tight text-white/90">{{ config.extra.name }}</span>
    </a>

    <nav class="pointer-events-auto hidden sm:flex items-center gap-8 text-sm text-white/70">
      {% if config.extra.show_projects_nav %}
      <a href="{{ get_url(path='projects') }}" class="hover:text-white transition-colors">Projects</a>
      {% endif %}
      {% if config.extra.show_blog_nav %}
      <a href="{{ get_url(path='blog') }}" class="hover:text-white transition-colors">Blog</a>
      {% endif %}
    </nav>
  </header>

  {% block content %}{% endblock content %}

  <script src="{{ get_url(path='js/main.js') }}" defer></script>
</body>
</html>
