<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Yahya SH - Portfolio & Projects">
  <title>Yahya SH - Portfolio</title>

  <!-- Preconnect to external domains to speed up connection setup -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Preload key font stylesheets to improve First Contentful Paint (FCP) -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" media="print" onload="this.media='all'">

  <style>
    /* Skip Link for sighted/keyboard-only users */
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: #38bdf8;
      color: #0f172a;
      padding: 8px 16px;
      font-weight: 700;
      z-index: 100;
      transition: top 0.2s ease;
      text-decoration: none;
      border-radius: 0 0 4px 0;
    }
    .skip-link:focus {
      top: 0;
    }

    /* Critical Inline CSS for instant First Contentful Paint (FCP) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }
    header {
      padding: 1.5rem 2rem;
      background-color: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav a {
      color: #38bdf8;
      text-decoration: none;
      margin-left: 1.5rem;
      font-weight: 600;
    }
    main {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 4rem 2rem;
      text-align: center;
    }
    #hero h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #f8fafc;
    }
    #hero p {
      font-size: 1.25rem;
      color: #94a3b8;
      max-width: 600px;
    }
    footer {
      text-align: center;
      padding: 2rem;
      background-color: #1e293b;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- Skip Navigation Link (Essential for sighted keyboard users) -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Header Landmark with explicit ARIA role -->
  <header role="banner">
    <div class="logo">Yahya SH</div>
    
    <!-- Navigation Landmark with explicit ARIA role -->
    <nav role="navigation" aria-label="Main Navigation">
      <a href="#hero">Home</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- Single Main Landmark with explicit ARIA role -->
  <main id="main-content" role="main" tabindex="-1">
    <section id="hero">
      <h1>Hello, I'm Yahya</h1>
      <p>Welcome to my portfolio. I build web experiences focused on performance and modern design.</p>
    </section>
  </main>

  <!-- Footer Landmark with explicit ARIA role -->
  <footer role="contentinfo">
    <p>&copy; 2026 Yahya SH. All rights reserved.</p>
  </footer>

</body>
</html>
